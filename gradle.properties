org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Forward slashes on purpose: Java .properties treats a backslash as an escape character.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# AGP 9 bundles Kotlin 2.2.0, which cannot read the 2.4.x metadata in io.legere:pdfiumandroid.
# Turn the built-in support off so the explicit Kotlin 2.4.10 plugin can be applied instead.
android.builtInKotlin=false
# The Kotlin plugin cannot be applied alongside AGP 9's new DSL, which is on by default.
android.newDsl=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official

# GitHub repository (owner/name) the app checks for new versions.
updateRepo=OWNER/rapid-office-pro
